<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Questionnaire Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning, calm and respectful for a busy businessman with basic English
   IDEA a language school placement booklet: one page at a time, big clear choices
   PICTURE the working questionnaire itself, with a step rail across the blue band
   COLOUR deep blue band, white pages, red accent for the current step and main button
   TYPE Onest 800 for titles, Onest for text (full Serbian Latin diacritics)
   LAYOUT blue band with title and steps, one calm column below; phone stacks the same way */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d1424);--ink:light-dark(#141a26,#e9edf5);--mute:light-dark(#55607a,#a3aec4);--band:light-dark(#13386e,#0a1c3d);--red:light-dark(#c8282e,#ff5a5f);--panel:light-dark(#f2f5fa,#151f35);--line:light-dark(#d4dbe7,#2a3753);--sel:light-dark(#e6eefb,#1c2d52);--ok:light-dark(#1f7a4a,#5fd39a)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.55 Onest,system-ui,sans-serif;overflow-x:clip}
.band{padding-block:clamp(24px,4vw,48px);padding-left:max(5vw,16px);padding-right:max(5vw,16px)}
header{background:var(--band);color:#fff}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:clamp(32px,5vw,46px);line-height:1.05;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance;font-weight:800}
header p{margin:0;opacity:.85;font-size:17px}
.rail{display:flex;gap:4px;margin-top:26px;list-style:none;padding:0}
.rail li{flex:1;font-size:13px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail li::before{content:"";display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.28);margin-bottom:7px}
.rail li.done{opacity:.85}
.rail li.done::before{background:#fff}
.rail li.now{opacity:1;font-weight:700}
.rail li.now::before{background:var(--red)}
.railtxt{display:none;margin-top:18px;font-size:15px}
main .wrap{padding-bottom:40px}
h2{font-size:30px;line-height:1.1;letter-spacing:-.01em;margin:0 0 8px}
.lead{color:var(--mute);margin:0 0 26px;max-width:62ch}
.q{margin:0 0 30px}
.q>.qt{font-weight:700;margin:0 0 10px;display:block}
.q .en{font-size:22px;font-weight:800;letter-spacing:-.01em}
.q.miss .qt{color:var(--red)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--mute)}
.opt input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--band)}
.opt:has(input:checked){background:var(--sel);border-color:var(--band)}
.opt.dk{color:var(--mute);font-style:italic}
.opt:has(input:focus-visible){outline:3px solid var(--red);outline-offset:2px}
input[type=text],textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
textarea{min-height:110px;resize:vertical}
input[type=text]:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--band) 40%,transparent);border-color:var(--band)}
.can{border-top:1px solid var(--line);padding:14px 0;margin:0}
.can .opts{grid-template-columns:repeat(3,minmax(0,1fr))}
.can .opt{min-height:46px;font-size:16px}
.mail{background:var(--panel);border-left:4px solid var(--band);border-radius:8px;padding:18px 20px;margin:0 0 28px;font-size:18px}
.mail p{margin:0 0 10px}.mail p:last-child{margin:0}
.play{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.sp{background:var(--panel);border-radius:12px;padding:18px 20px;margin:0 0 16px}
.sp .en{font-size:21px;font-weight:800;line-height:1.25;margin:0 0 2px}
.sp .tr{color:var(--mute);margin:0 0 14px;font-size:16px}
.sp audio{width:100%;max-width:420px;height:44px}
.sp.recording{outline:3px solid var(--red)}
.sp .st{font-size:15px;color:var(--mute)}
.sp .st.done{color:var(--ok);font-weight:700}
.sp .st.err{color:var(--red);font-weight:700}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:22px;margin-top:10px}
button{font:inherit;font-size:17px;font-weight:700;min-height:50px;padding:0 24px;border-radius:10px;cursor:pointer;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
button:hover{border-color:var(--mute)}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
button.go{background:var(--red);border-color:var(--red);color:#fff}
button.go:hover{filter:brightness(1.08)}
button.sm{min-height:44px;font-size:16px;padding:0 16px}
.warn{color:var(--red);font-weight:700;margin:0;flex-basis:100%}
.note{background:var(--panel);border-radius:10px;padding:16px 18px;margin:0 0 26px;font-size:17px}
.note ul{margin:8px 0 0;padding-left:20px}
.lvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;background:var(--band);color:#fff;border-radius:14px;padding:22px 24px;margin:0 0 24px}
.lvl b{font-size:clamp(56px,10vw,84px);line-height:1;font-weight:800;letter-spacing:-.03em}
.lvl p{margin:0;font-size:18px}
.lvl small{display:block;opacity:.8;font-size:15px;margin-top:4px}
.rows{display:grid;gap:10px;margin:0 0 28px}
.row{display:grid;grid-template-columns:8.5em minmax(0,1fr) 4.5em;gap:12px;align-items:center;font-size:16px}
.bar{height:14px;background:var(--panel);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--band);border-radius:7px}
.row span:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.save{background:var(--panel);border:2px solid var(--band);border-radius:14px;padding:22px 24px;margin:0 0 26px}
.save h2{margin-bottom:6px}
.ok{color:var(--ok);font-weight:700}
@media(prefers-color-scheme:dark){.bar i{background:#6f98e0}.opt:has(input:checked){border-color:#6f98e0}}
@media(max-width:600px){body{font-size:17px}.rail{display:none}.railtxt{display:block}.can .opts{grid-template-columns:minmax(0,1fr)}.lvl{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:6.5em minmax(0,1fr) 4em}.nav button{flex:1}}
@media(prefers-reduced-motion:no-preference){main .wrap{animation:in .35s ease-out}}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <h1 id="h1"></h1>
    <p id="sub"></p>
    <ol class="rail" id="rail"></ol>
    <div class="railtxt" id="railtxt"></div>
  </div>
</header>
<main class="band"><div class="wrap" id="page"></div><p style="text-align:center;color:var(--mute);font-size:13px;margin:0 0 20px">v3</p></main>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const opt=(id,i,label,multi,cls='')=>{const v=st.a[id];const on=multi?(v||[]).includes(i):v===i;return `<label class="opt ${cls}"><input type="${multi?'checkbox':'radio'}" name="${id}" value="${i}" ${on?'checked':''}><span>${esc(label)}</span></label>`};
const field=f=>{
  if(f.t==='text')return `<div class="q"><label class="qt" for="${f.id}">${esc(X(f.q))}</label><input type="text" id="${f.id}" value="${esc(st.a[f.id]||'')}"></div>`;
  if(f.t==='area')return `<div class="q"><label class="qt" for="${f.id}">${esc(X(f.q))}</label><textarea id="${f.id}">${esc(st.a[f.id]||'')}</textarea></div>`;
  return `<div class="q" data-q="${f.t==='r'?f.id:''}"><span class="qt">${esc(X(f.q))}</span><div class="opts">${f.o.map((o,i)=>opt(f.id,i,X(o),f.t==='c')).join('')}</div></div>`;
};
const test=(it,big)=>`<div class="q" data-q="${it.id}"><span class="qt">${big?`<span class="en">${esc(X(it.q))}</span>`:esc(X(it.q))}</span><div class="opts">${it.o.map((o,i)=>opt(it.id,i,X(o))).join('')}${opt(it.id,-1,X(T.dk),false,'dk')}${it.say?opt(it.id,-2,X(T.nosnd),false,'dk'):''}</div></div>`;
const canQ=c=>`<div class="q can" data-q="${c.id}"><span class="qt">${esc(X(c.q))}</span><div class="opts">${CANO.map((o,i)=>opt(c.id,i,SR?o[0]:o[1])).join('')}</div></div>`;

let bv=null;
function bestVoice(){
  try{const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  const pref=[/natural/i,/neural/i,/online/i,/google uk english female/i,/google uk english/i,/google us english/i,/premium|enhanced/i,/serena|daniel|kate|samantha|karen|moira/i];
  for(const r of pref){const v=vs.find(v=>r.test(v.name));if(v)return v}
  return vs.find(v=>/en[-_]GB/i.test(v.lang))||vs[0]||null}catch(e){return null}
}

let cur=null;
function playClip(key,text,rate){
  const src=CLIPS[key];
  try{speechSynthesis.cancel()}catch(e){}
  if(cur){cur.pause();cur=null}
  if(!src){say(text,rate);return}
  const a=new Audio(blobUrl(src));a.setAttribute('playsinline','');a.preservesPitch=true;a.playbackRate=rate<0.85?0.75:1;cur=a;
  a.play().catch(()=>say(text,rate));
}
function say(text,rate){
  try{const u=new SpeechSynthesisUtterance(text);u.rate=rate;bv=bv||bestVoice();if(bv){u.voice=bv;u.lang=bv.lang}else u.lang='en-GB';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{bv=bestVoice()}}catch(e){}

/* ---------- recording ---------- */
let mr=null,recIdx=-1,t0=0,tick=null,stream=null,errIdx=-1,errMsg='';
const bcache={};
function blobUrl(d){if(!d)return '';if(bcache[d])return bcache[d];try{const [m,b]=d.split(',');const mime=(m.match(/data:([^;]+)/)||[])[1]||'audio/mpeg';const bin=atob(b);const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return bcache[d]=URL.createObjectURL(new Blob([u],{type:mime}))}catch(e){return d}}
const mmss=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
function spCard(i){
  const s=SPK[i],r=rec[i],on=recIdx===i;
  let st2='';
  if(on)st2=`<span class="st err" id="tm">${X(T.recording)} 0:00</span>`;
  else if(errIdx===i)st2=`<span class="st err">${esc(errMsg)}</span>`;
  else if(r)st2=`<span class="st done">${X(T.saved)} (${mmss(r.sec)})</span>`;
  return `<div class="sp${on?' recording':''}" id="sp${i}"><p class="en" lang="en">${i+1}. ${esc(s.en)}</p>${SR?`<p class="tr">${esc(s.sr)}</p>`:'<p class="tr"></p>'}
  <div class="play"><button class="sm" data-q2="${i}">${X(T.hear)}</button>${on?`<button class="go sm" data-stop="${i}">${X(T.stop)}</button>`:`<button class="go sm" data-rec="${i}" ${recIdx>=0?'disabled':''}>${r?X(T.rerec):X(T.rec)}</button>`}${st2}</div>
  ${r&&!on?`<audio controls playsinline preload="auto" src="${blobUrl(r.data)}"></audio>`:''}</div>`;
}
const redrawSp=()=>SPK.forEach((_,i)=>{const el=document.getElementById('sp'+i);if(el)el.outerHTML=spCard(i)});
async function startRec(i){
  errIdx=-1;
  if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){errIdx=i;errMsg=X(T.nomic);redrawSp();return}
  const live=stream&&stream.getAudioTracks().some(t=>t.readyState==='live'&&!t.muted);
  if(!live){
    let err=null;stream=null;
    for(const c of [{audio:true},{audio:{echoCancellation:true}}]){
      try{stream=await navigator.mediaDevices.getUserMedia(c);break}catch(e){err=e}
    }
    if(!stream){errIdx=i;errMsg=(err&&err.name==='NotAllowedError'?X(T.denied):X(T.nomic))+` [${err?err.name:'?'}: ${err?err.message:''}]`;redrawSp();return}
  }
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  const chunks=[];
  try{mr=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(e){try{mr=new MediaRecorder(stream)}catch(e2){errIdx=i;errMsg=X(T.nomic)+` [${e2.name}: ${e2.message}]`;redrawSp();return}}
  mr.onerror=ev=>{errIdx=i;errMsg=`[${ev.error?ev.error.name:'recorder error'}]`;recIdx=-1;clearInterval(tick);redrawSp()};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{
    clearInterval(tick);
    const sec=Math.max(1,Math.round((Date.now()-t0)/1000));
    const b=new Blob(chunks,{type:(mr.mimeType||mime||'audio/webm').split(';')[0]});
    if(!b.size){errIdx=i;errMsg='[empty recording – please try again]';recIdx=-1;redrawSp();return}
    const fr=new FileReader();
    fr.onload=()=>{rec[i]={data:fr.result,sec,type:b.type};saveRec();recIdx=-1;redrawSp()};
    fr.readAsDataURL(b);
  };
  try{mr.start()}catch(e){errIdx=i;errMsg=X(T.nomic)+` [${e.name}: ${e.message}]`;redrawSp();return}
  t0=Date.now();recIdx=i;redrawSp();
  tick=setInterval(()=>{const s=Math.round((Date.now()-t0)/1000);const el=document.getElementById('tm');if(el)el.textContent=`${X(T.recording)} ${mmss(s)}`;if(s>=150)stopRec()},500);
}
function stopRec(){try{if(mr&&mr.state!=='inactive')mr.stop()}catch(e){}}
function releaseMic(){try{if(stream)stream.getTracks().forEach(t=>t.stop())}catch(e){}stream=null}

{n:['Početak','Start'],h:()=>SR?`<h2>Dobrodošli</h2><p class="lead">Ovaj upitnik nam pomaže da vidimo koliko engleskog već znate i šta želite da postignete. Na osnovu Vaših odgovora pravimo program učenja po meri Vašeg vremena i posla.</p>

<div class="note"><b>Before you start:</b><ul><li>It takes about 20 minutes. Progress is saved, so you can stop and continue later.</li><li>It works best on a <b>computer, in Chrome</b>, with sound and microphone on.</li><li>Don't use a translator or dictionary. This isn't an exam – honest answers give the best plan.</li><li>If you don't know an answer, just choose <b>"I don't know"</b>. That's completely fine.</li><li>At the end you click "Save results" and send that one file back.</li></ul></div>`},
{n:['O Vama','About you'],h:()=>`<h2>${SR?'O Vama':'About you'}</h2><p class="lead">${SR?'Nekoliko osnovnih pitanja o Vama i Vašem iskustvu sa engleskim.':'A few basic questions about you and your experience with English.'}</p>${ABOUT.map(field).join('')}`},
{n:['Samoprocena','Self-check'],h:()=>`<h2>${SR?'Šta već možete?':'What can you already do?'}</h2><p class="lead">${SR?'Za svaku rečenicu izaberite šta najbolje opisuje Vaš engleski danas.':'For each sentence, choose what best describes your English today.'}</p>${CAN.map(canQ).join('')}`,req:CAN.map(c=>c.id)},
{n:['Reči','Words'],h:()=>`<h2>${SR?'Reči':'Words'}</h2><p class="lead">${SR?'Šta znači ova engleska reč? Izaberite prevod.':'What does this English word mean? (In his version the options are Serbian words; here each shows an English meaning with the Serbian in brackets.)'}</p>${VOC.map(v=>test(v,1)).join('')}`,req:VOC.map(v=>v.id)},
{n:['Gramatika','Grammar'],h:()=>`<h2>${SR?'Gramatika':'Grammar'}</h2><p class="lead">${SR?'Koja reč nedostaje u rečenici? Pitanja postaju sve teža – kada postane preteško, izaberite „Ne znam”.':'Which word is missing from the sentence? The questions get harder – when it becomes too hard, choose "I don\'t know".'}</p>${GR.map(g=>test(g,1)).join('')}`,req:GR.map(g=>g.id)},
{n:['Čitanje','Reading'],h:()=>`<h2>${SR?'Čitanje':'Reading'}</h2><p class="lead">${SR?'Pročitajte e-mail i odgovorite na pitanja.':'Read the email and answer the questions.'}</p><div class="mail" lang="en"><p><b>Subject:</b> Your order #4471</p><p>Hi Marko,</p><p>Thank you for your order. Unfortunately, the delivery will be two days late because of a problem at the port. The goods will arrive on Thursday, not Tuesday.</p><p>We are sorry for the delay. As compensation, we will give you a 5% discount on your next order.</p><p>Best regards,<br>Anna</p></div>${RD.map(r=>test(r)).join('')}`,req:RD.map(r=>r.id)},
{n:['Slušanje','Listening'],h:()=>`<h2>${SR?'Slušanje':'Listening'}</h2><p class="lead">${SR?'Kliknite „Pusti” i poslušajte rečenicu. Možete je pustiti više puta i sporije. Ako zvuk ne radi, izaberite „Ne mogu da pustim zvuk”.':'Click "Play" and listen to the sentence. You can play it several times, and slower. If the sound doesn\'t work, choose "I can\'t play the sound".'}</p>${LS.map((l,i)=>`<div class="play"><button class="sm" data-say="${i}" data-rate="0.92">${X(T.play)} ${i+1}</button><button class="sm" data-say="${i}" data-rate="0.7">${X(T.slow)}</button></div>${test(l)}`).join('')}`,req:LS.map(l=>l.id)},
{n:['Pisanje','Writing'],h:()=>`<h2>${SR?'Pisanje':'Writing'}</h2><p class="lead">${SR?'Napišite na engleskom 2–3 rečenice o sebi i svom poslu. Greške nisu problem. Ako ne ide, napišite šta biste hteli da kažete – deo ili sve može i na srpskom.':'Write 2–3 sentences in English about yourself and your work. Mistakes are fine. If it\'s too hard, write what you\'d like to say – part or all of it can be in Serbian.'}</p><div class="q"><label class="qt" for="write">${SR?'Vaš tekst':'Your text'}</label><textarea id="write" lang="en" placeholder="My name is … I work in …">${esc(st.a.write||'')}</textarea></div>`},
{n:['Govor','Speaking'],h:()=>`<h2>${SR?'Govor':'Speaking'}</h2><p class="lead">${SR?'Za svako pitanje kliknite „Snimi”, odgovorite <b>na engleskom</b> (oko 20–60 sekundi), pa kliknite „Zaustavi”. Možete preslušati snimak i snimiti ponovo. Kratki i jednostavni odgovori su sasvim u redu, čak i samo nekoliko reči.':'For each question click "Record", answer <b>in English</b> (about 20–60 seconds), then click "Stop". You can listen back and record again. Short, simple answers are completely fine, even just a few words.'}</p>
<div class="note">${SR?'Prvi put će pregledač pitati za dozvolu za mikrofon – kliknite <b>„Dozvoli” (Allow)</b>.':'The first time, the browser will ask for microphone permission – click <b>"Allow"</b>.'}</div>${SPK.map((_,i)=>spCard(i)).join('')}`},
{n:['Ciljevi','Goals'],h:()=>`<h2>${SR?'Vaši ciljevi i vreme':'Your goals and time'}</h2><p class="lead">${SR?'Na kraju: šta želite da postignete i koliko vremena možete da odvojite.':'Finally: what you want to achieve and how much time you can give.'}</p>${GOALS.map(field).join('')}`,req:GOALS.filter(f=>f.t==='r').map(f=>f.id)},
{n:['Rezultat','Result'],h:()=>result()}
];
document.addEventListener('play',e=>{document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()});if(cur&&e.target!==cur){cur.pause();cur=null}},true);
const SPEAK_STEP=STEPS.findIndex(s=>s.n[1]==='Speaking');

function score(){
  const per={};LV.forEach(l=>per[l]={c:0,n:0});
  const sec=arr=>{let c=0,n=0;arr.forEach(it=>{const v=st.a[it.id];if(v===-2||v===undefined)return;n++;per[it.lv].n++;if(v===it.c){c++;per[it.lv].c++}});return{c,n,t:arr.length}};
  const S={voc:sec(VOC),gr:sec(GR),rd:sec(RD),ls:sec(LS)};
  let lv='A0';for(const l of LV){const p=per[l];if(!p.n)continue;if(p.c/p.n>=0.6)lv=l;else break}
  let self='A0';for(const l of LV){const it=CAN.filter(c=>c.lv===l);const avg=it.reduce((s,c)=>s+(st.a[c.id]??0),0)/it.length;if(avg>=1)self=l;else break}
  return{S,per,lv,self};
}
const lab=(f,v)=>Array.isArray(v)?v.map(i=>f.o[i][1]).join(', '):(v===undefined?'—':f.o[v][1]);
function summary(r){
  const a=st.a,L=[];
  const line=f=>{const v=a[f.id];const s=f.o?lab(f,v):(v||'').trim();L.push(`${f.en}: ${s&&s.length?s:'—'}`)};
  L.push('ENGLISH PLACEMENT – RESULTS',`Completed: ${new Date().toLocaleString('en-GB')}`,'');
  L.push(`Estimated level (test): ${LVEN[r.lv]}`,`Self-assessed level: ${LVEN[r.self]}`);
  const f=x=>x.n<x.t?`${x.c}/${x.n} (${x.t-x.n} skipped – no audio)`:`${x.c}/${x.t}`;
  L.push(`Vocabulary ${f(r.S.voc)} · Grammar ${f(r.S.gr)} · Reading ${f(r.S.rd)} · Listening ${f(r.S.ls)}`);
  L.push('By level: '+LV.map(l=>`${l} ${r.per[l].c}/${r.per[l].n}`).join(', '));
  const wrong=[...VOC,...GR,...RD,...LS].filter(it=>st.a[it.id]!==undefined&&st.a[it.id]!==it.c&&st.a[it.id]!==-2).map(it=>`${it.id}${st.a[it.id]===-1?" (didn't know)":''}`);
  L.push(`Missed items: ${wrong.join(', ')||'none'}`);
  L.push('','— ABOUT');ABOUT.forEach(line);
  L.push('','— CAN-DO SELF-ASSESSMENT');CAN.forEach(c=>L.push(`[${c.lv}] ${c.en}: ${CANO[a[c.id]]?.[2]||'—'}`));
  L.push('','— WRITING SAMPLE',(a.write||'').trim()||'(left blank)');
  L.push('','— SPEAKING',...SPK.map((s,i)=>`${i+1}. [${s.lv}] ${s.en} → ${rec[i]?`recorded, ${mmss(rec[i].sec)}`:'not recorded'}`));
  L.push('','— GOALS & TIME');GOALS.forEach(line);
  return L.join('\n');
}

function resultsFile(r){
  const name=(st.a.name||'').trim()||'—';
  const items={};for(const [k,arr] of Object.entries({vocab:VOC,grammar:GR,reading:RD,listening:LS}))items[k]=arr.map(it=>({id:it.id,level:it.lv,prompt:it.say||X(it.q),answer:st.a[it.id]===-1?"I don't know":st.a[it.id]===-2?'skipped (no audio)':it.o[st.a[it.id]],correct:it.o[it.c],ok:st.a[it.id]===it.c}));
  const data={lang:LANG,completed:new Date().toISOString(),level:r.lv,selfLevel:r.self,scores:r.S,byLevel:r.per,answers:st.a,items,speaking:SPK.map((s,i)=>({q:s.en,level:s.lv,recorded:!!rec[i],seconds:rec[i]?.sec||0}))};
  const clips=SPK.map((s,i)=>`<section><h3>${i+1}. ${esc(s.en)} <small>(${s.lv})</small></h3>${rec[i]?`<audio controls preload="metadata" src="${rec[i].data}"></audio><p class="m">${mmss(rec[i].sec)}</p>`:'<p class="m">Not recorded</p>'}</section>`).join('');
  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English placement results – ${esc(name)}</title>
<style>body{margin:0;font:17px/1.55 system-ui,sans-serif;color:#141a26;background:#fff}header{background:#13386e;color:#fff;padding:28px max(5vw,16px)}h1{margin:0 0 4px;font-size:34px;line-height:1.1}main{max-width:820px;margin:0 auto;padding:24px max(5vw,16px) 48px}.lv{font-size:56px;font-weight:800;line-height:1}h2{margin:32px 0 10px;font-size:24px}h3{margin:0 0 8px;font-size:18px}h3 small{color:#55607a;font-weight:400}section{background:#f2f5fa;border-radius:10px;padding:14px 16px;margin:0 0 12px}audio{width:100%;max-width:460px}.m{color:#55607a;margin:4px 0 0;font-size:15px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5fa;border-radius:10px;padding:16px;font-size:14px}</style></head>
<body><header><h1>English placement results</h1><div>${esc(name)} · ${esc(new Date().toLocaleString('en-GB'))}</div></header><main>
<p class="lv">${r.lv}</p><p>${esc(LVEN[r.lv])} on the test · self-assessed ${esc(LVEN[r.self])}</p>
<h2>Speaking – voice notes</h2>${clips}
<h2>Full answers</h2><pre>${esc(summary(r))}</pre>
<script>document.querySelectorAll('audio').forEach(a=>{try{const d=a.getAttribute('src');const [m,b]=d.split(',');const bin=atob(b);const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);a.src=URL.createObjectURL(new Blob([u],{type:(m.match(/data:([^;]+)/)||[])[1]||'audio/mp4'}))}catch(e){}})<\/script>
<script type="application/json" id="data">${JSON.stringify(data).replace(/</g,'\\u003c')}<\/script>
</main></body></html>`;
}
function downloadResults(){
  const r=score();const html=resultsFile(r);
  const nm=((st.a.name||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'odgovori');
  const fname=`engleski-rezultati-${nm}.html`;
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=fname;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
  const m=document.getElementById('smsg');if(m){m.className='ok';m.textContent=X(T.savedMsg)+fname}
}
function result(){
  const r=score();const S=r.S;const n=Object.keys(rec).length;
  const bar=(nm,x)=>{const p=x.n?Math.round(100*x.c/x.n):0;return `<div class="row"><span>${nm}</span><div class="bar"><i style="width:${p}%"></i></div><span>${x.n?`${x.c} / ${x.n}`:'—'}</span></div>`};
  return `<h2>${SR?'Hvala Vam!':'Thank you!'}</h2>
  <div class="save"><h2>${SR?'Poslednji korak: sačuvajte i pošaljite':'Last step: save and send'}</h2><p class="lead" style="margin-bottom:16px">${SR?'Kliknite dugme ispod. Sačuvaće se jedan fajl sa svim Vašim odgovorima i snimcima (obično u folderu „Preuzimanja” / Downloads). Pošaljite taj fajl nazad osobi koja Vam je poslala upitnik.':'Click the button below. One file with all your answers and recordings will be saved (usually in your Downloads folder). Send that file back to the person who sent you this questionnaire.'}</p>
  <div class="play"><button class="go" id="dl">${X(T.saveBtn)}</button><span id="smsg"></span></div><p class="st" style="margin:6px 0 0;color:var(--mute);font-size:15px">${SR?`Snimljenih odgovora: ${n} od ${SPK.length}`:`Voice notes recorded: ${n} of ${SPK.length}`}</p></div>
  <p class="lead">${SR?'Ovo je okvirna procena na osnovu kratkog testa. Tačan plan pravimo kada pregledamo sve Vaše odgovore i snimke.':'This is a rough estimate from a short test. The exact plan comes once we review all your answers and recordings.'}</p>
  <div class="lvl"><b>${r.lv}</b><p>${X(LVTXT[r.lv])}<small>${SR?'Vaša samoprocena':'Your self-assessment'}: ${r.self}</small></p></div>
  <div class="rows">${bar(SR?'Reči':'Words',S.voc)}${bar(SR?'Gramatika':'Grammar',S.gr)}${bar(SR?'Čitanje':'Reading',S.rd)}${bar(SR?'Slušanje':'Listening',S.ls)}</div>`;
}

const page=document.getElementById('page');
document.getElementById('h1').textContent=X(T.h1);
document.getElementById('sub').textContent=X(T.sub);
function render(){
  if(recIdx>=0)stopRec();
  if(st.step!==SPEAK_STEP&&stream&&recIdx<0)releaseMic();
  const s=STEPS[st.step];
  document.getElementById('rail').innerHTML=STEPS.slice(1).map((x,i)=>`<li class="${i+1<st.step?'done':i+1===st.step?'now':''}" title="${X(x.n)}">${X(x.n)}</li>`).join('');
  document.getElementById('railtxt').textContent=st.step?`${X(T.step)} ${st.step} ${X(T.of)} ${STEPS.length-1} · ${X(s.n)}`:'';
  const last=st.step===STEPS.length-1;
  page.innerHTML=s.h()+`<div class="nav">${st.step?`<button id="back">${X(T.back)}</button>`:'<span></span>'}${last?`<button id="reset">${X(T.again)}</button>`:`<button class="go" id="next">${st.step?(st.step===STEPS.length-2?X(T.finish):X(T.next)):X(T.start)}</button>`}<p class="warn" id="warn" hidden></p></div>`;
  save();
}
const go=d=>{st.step=Math.max(0,Math.min(STEPS.length-1,st.step+d));render();window.scrollTo({top:0,behavior:'smooth'})};

page.addEventListener('change',e=>{
  const t=e.target;if(t.type==='radio'){st.a[t.name]=+t.value;t.closest('.q')?.classList.remove('miss')}
  else if(t.type==='checkbox'){const v=+t.value;const arr=st.a[t.name]||[];st.a[t.name]=t.checked?[...arr.filter(x=>x!==v),v].sort((a,b)=>a-b):arr.filter(x=>x!==v)}
  save();
});
page.addEventListener('input',e=>{const t=e.target;if(t.id&&(t.type==='text'||t.tagName==='TEXTAREA')){st.a[t.id]=t.value;save()}});
let resetArm=false;
page.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='next'){
    const miss=(STEPS[st.step].req||[]).filter(id=>st.a[id]===undefined);
    page.querySelectorAll('.q.miss').forEach(q=>q.classList.remove('miss'));
    if(miss.length){miss.forEach(id=>page.querySelector(`[data-q="${id}"]`)?.classList.add('miss'));const w=document.getElementById('warn');w.hidden=false;w.textContent=X(T.miss);page.querySelector('.q.miss')?.scrollIntoView({behavior:'smooth',block:'center'});return}
    go(1);
  }
  if(b.id==='back')go(-1);
  if(b.id==='reset'){if(!resetArm){resetArm=true;b.textContent=X(T.sure);setTimeout(()=>{resetArm=false;if(b.isConnected)b.textContent=X(T.again)},4000);return}resetArm=false;st={step:0,a:{}};rec={};saveRec();render()}
  if(b.dataset.say!==undefined)playClip('listen-'+(+b.dataset.say+1),LS[+b.dataset.say].say,+b.dataset.rate);
  if(b.dataset.q2!==undefined)playClip('question-'+(+b.dataset.q2+1),SPK[+b.dataset.q2].en,0.92);
  if(b.dataset.rec!==undefined){try{speechSynthesis.cancel()}catch(err){}if(cur){cur.pause();cur=null}startRec(+b.dataset.rec)}
  if(b.dataset.stop!==undefined)stopRec();
  if(b.id==='dl')downloadResults();
});
render();
}
</script>
</body>
</html>
